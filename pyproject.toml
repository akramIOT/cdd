[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contrastive-decoding-diffing"
version = "0.1.0"
description = "Contrastive Decoding Diffing (CDD): audit fine-tuned LLMs for hidden behaviors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.47.0",
    "accelerate>=0.34.0",
    "peft>=0.10.0",
    "huggingface_hub>=0.24.0",
    "numpy>=1.26.0",
    "tqdm",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40.0"]
diagnose = ["openai>=1.0.0", "matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
cdd = "cdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
